[project]
name = "rushes-local-stt"
version = "0.1.0"
description = "On-device Whisper STT service for Rushes, runs Whisper large-v3 in MLX on Apple Silicon."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mlx-whisper>=0.4",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rushes_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
